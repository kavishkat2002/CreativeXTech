  <circle cx="500" cy="156" r="52" stroke="#ECE8DF" stroke-width="22"/>
  <circle cx="500" cy="156" r="52" stroke="#151515" stroke-width="22" stroke-dasharray="105 222" stroke-dashoffset="0" stroke-linecap="butt" transform="rotate(-90 500 156)"/>

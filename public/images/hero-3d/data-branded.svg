  <circle cx="131" cy="154" r="4.5" fill="#FFFFFF" stroke="#FF4B23" stroke-width="2.5"/>
  <circle cx="211" cy="126" r="4.5" fill="#FFFFFF" stroke="#FF4B23" stroke-width="2.5"/>
  <circle cx="291" cy="100" r="4.5" fill="#FFFFFF" stroke="#FF4B23" stroke-width="2.5"/>
  <circle cx="331" cy="82" r="5.5" fill="#FF4B23" stroke="#151515" stroke-width="2"/>

